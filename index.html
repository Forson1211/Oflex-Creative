  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'" />

  <script>
    // Critical Path: Hydrate theme from localStorage instantly to prevent flash
    (function () {
      try {
        const theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');

        // Supabase warmup
        const link = document.createElement('link');
        link.rel = 'preconnect';
        link.href = 'https://tbtzxtcllslosvpxskup.supabase.co';
        document.head.appendChild(link);
      } catch (e) { }
    })();
  </script>
