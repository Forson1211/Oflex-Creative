  <script>
    // Critical Path: Hydrate theme from localStorage instantly to prevent flash
    (function () {
      try {
        const theme = localStorage.getItem('theme') || 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>
