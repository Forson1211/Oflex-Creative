<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="800" fill="#0F172A"/>
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="filter0_f" x="150" y="150" width="500" height="500" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
      <feBlend mode="normal" in="SourceGraphic" in2="BackgroundImageFix" result="shape"/>
      <feGaussianBlur stdDeviation="40" result="effect1_foregroundBlur"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#paint0_linear)"/>
  
  <!-- Subtle Glow -->
  <circle cx="400" cy="400" r="150" fill="#8B5CF6" fill-opacity="0.1" filter="url(#filter0_f)"/>
  
  <!-- Stylized Logo Element -->
  <circle cx="400" cy="400" r="120" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="20 10" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="0 400 400" to="360 400 400" dur="60s" repeatCount="indefinity" />
  </circle>
  
  <path d="M400 280V320M400 480V520M280 400H320M480 400H520" stroke="#8B5CF6" stroke-width="2" opacity="0.2"/>
  
  <!-- OFLEX Text -->
  <text x="50%" y="415" text-anchor="middle" fill="white" style="font-family: 'Inter', sans-serif; font-weight: 800; font-size: 64px; letter-spacing: 0.2em;">OFLEX</text>
  <text x="50%" y="460" text-anchor="middle" fill="#8B5CF6" style="font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; letter-spacing: 0.5em; opacity: 0.6;">CREATIVE STUDIO</text>
  
  <!-- Minimalist frame -->
  <rect x="40" y="40" width="720" height="720" border-radius="20" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
</svg>